<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Universidade JV · Em manutenção</title>
<style>
  :root { --azul: #0b3a6e; --azul-claro: #1d5fa8; --texto: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-claro) 100%);
    color: var(--texto); font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 520px; }
  .marca { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; opacity: .8; margin-bottom: 24px; }
  h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 700; margin-bottom: 16px; }
  p { font-size: 17px; line-height: 1.6; opacity: .9; }
</style>
</head>
<body>
  <div class="card">
    <div class="marca">Universidade JV · Jerônimo da Veiga</div>
    <h1>Estamos em manutenção</h1>
    <p>O portal está passando por melhorias e volta em breve.<br>Em caso de dúvida, fale com a coordenação comercial.</p>
  </div>
</body>
</html>
