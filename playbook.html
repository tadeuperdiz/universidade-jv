<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Playbook · Contorno de Objeções</title>
<style>


*{box-sizing:border-box;margin:0;padding:0}
:root{--roxo:#534AB7;--roxo-dark:#3C3489;--roxo-light:#EEEDFE;--roxo-mid:#AFA9EC;--dourado:#C9920A;--dourado-light:#F5D98A;--dourado-bg:#FAEEDA;--dourado-dark:#854F0B;--laranja:#D85A30;--verde:#3B6D11;--verde-bg:#EAF3DE;--azul:#185FA5;--azul-light:#E6F1FB;--azul-mid:#378ADD;--chumbo:#2D3748;--chumbo-light:#EDF2F7;--chumbo-mid:#4A5568;--am:#854F0B;--am-light:#FAEEDA;--am-mid:#C9920A}
body{font-family:system-ui,-apple-system,sans-serif;background:#F0EFF8;min-height:100vh}
.screen{display:none}.screen.active{display:block}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.lightbox.active{display:flex}
.lb-header{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.lb-title{color:white;font-size:14px;font-weight:700}
.lb-close{background:rgba(255,255,255,.15);border:none;color:white;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.lb-close:hover{background:rgba(255,255,255,.3)}
.lb-frame{width:100%;max-width:820px;border-radius:12px;overflow:hidden;background:#000}
.lb-frame iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.lb-footer{margin-top:.75rem;color:rgba(255,255,255,.45);font-size:11px;text-align:center}
.video-thumb{border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:#1a1a2e;margin-bottom:6px}
.vt-bg{width:100%;height:175px;display:flex;align-items:center;justify-content:center}
.play-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.play-btn-big{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:2.5px solid white;background:rgba(255,255,255,.15);transition:transform .2s}
.video-thumb:hover .play-btn-big{transform:scale(1.1);background:rgba(255,255,255,.28)}
.play-label{color:white;font-size:12px;font-weight:600}.play-hint{color:rgba(255,255,255,.65);font-size:10px}
.video-label-bar{padding:7px 12px;font-size:11px;font-weight:600;border-radius:0 0 8px 8px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.video-label-bar.az{background:var(--azul-light);color:var(--azul)}.video-label-bar.ch{background:var(--chumbo-light);color:var(--chumbo)}.video-label-bar.am{background:var(--am-light);color:var(--am)}
.hdr{background:var(--roxo-dark);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hlogo{color:white;font-size:14px;font-weight:700;letter-spacing:1px}.hlogo span{color:var(--dourado-light)}
.hright{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--dourado);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0}
.hname{font-size:12px;color:rgba(255,255,255,.8)}.btn-out{font-size:11px;color:rgba(255,255,255,.5);background:none;border:none;cursor:pointer;text-decoration:underline}
#s-login{min-height:100vh;background:linear-gradient(135deg,#26215C,#534AB7);display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
#s-login.active{display:flex}
.lbox{background:white;border-radius:16px;padding:2rem 1.75rem;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lcrown{font-size:40px;margin-bottom:.5rem}
.ltitle{font-size:22px;font-weight:800;color:var(--roxo-dark)}.ltitle span{color:var(--dourado)}
.lsub{font-size:10px;color:var(--dourado);font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:1.5rem}
.lbox p{font-size:13px;color:#888;margin-bottom:1.25rem}
.lbox input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;margin-bottom:10px;outline:none;transition:border .2s}
.lbox input:focus{border-color:var(--roxo)}
.btn-pri{width:100%;padding:13px;background:var(--roxo);color:white;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer}
.btn-pri:hover{background:var(--roxo-dark)}
.alink{margin-top:.875rem;font-size:12px;color:#aaa;cursor:pointer;text-decoration:underline}
.lerr{color:#A32D2D;font-size:12px;margin-top:8px;display:none}
.dash-hero{background:linear-gradient(135deg,#3C3489,#534AB7);padding:1.75rem 1.25rem}
.dash-hero h1{color:white;font-size:20px;font-weight:700;margin-bottom:4px}.dash-hero p{color:rgba(255,255,255,.75);font-size:13px}
.dpbar-wrap{background:rgba(255,255,255,.2);border-radius:20px;height:8px;margin:.875rem 0 .25rem}
.dpbar-fill{background:var(--dourado);height:8px;border-radius:20px;transition:width .6s}
.dpbar-label{color:rgba(255,255,255,.75);font-size:11px}
.mods-list{padding:1.25rem;display:flex;flex-direction:column;gap:10px}
.mcard{background:white;border-radius:12px;border:1px solid #eee;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s}
.mcard:hover:not(.mlocked){border-color:var(--roxo-mid);box-shadow:0 2px 12px rgba(83,74,183,.12)}
.mcard.mdone{border-color:var(--dourado);background:var(--dourado-bg)}.mcard.mlocked{opacity:.55;cursor:not-allowed}
.micon{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--roxo-light)}.micon.g{background:var(--dourado-bg)}
.minfo{flex:1}.mnum{font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.mtitle{font-size:14px;font-weight:700;color:#222;margin:2px 0}.mdesc{font-size:11px;color:#888}
.mpw{background:#e8e8e8;border-radius:10px;height:4px;margin-top:5px}
.mpf{height:4px;border-radius:10px;background:var(--roxo)}.mpf.done{background:var(--dourado)}
.mpl{font-size:10px;color:#999;margin-top:2px}
.mbadge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;flex-shrink:0}
.mbadge.done{background:var(--dourado-bg);color:var(--dourado-dark)}.mbadge.next{background:var(--roxo-light);color:var(--roxo)}.mbadge.locked{background:#f0f0f0;color:#999}
.mod-hero{padding:1.25rem}
.mod-hero.p1{background:linear-gradient(135deg,#3C3489,#534AB7)}.mod-hero.p2{background:linear-gradient(135deg,#993C1D,#D85A30)}
.mod-hero.p3{background:linear-gradient(135deg,#185FA5,#378ADD)}.mod-hero.p4{background:linear-gradient(135deg,#854F0B,#C9920A)}
.mod-hero.p5{background:linear-gradient(135deg,#2D3748,#4A5568)}.mod-hero.p6{background:linear-gradient(135deg,#26215C,#3C3489)}
.mtag{font-size:10px;color:rgba(255,255,255,.8);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.mod-hero h1{color:white;font-size:18px;font-weight:700;margin-bottom:3px}.mod-hero p{color:rgba(255,255,255,.8);font-size:12px}
.back-btn{background:none;border:none;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;margin-bottom:8px}.back-btn:hover{color:white}
.oprog{padding:.75rem 1rem;background:white;border-bottom:1px solid #eee}
.oprog-head{display:flex;justify-content:space-between;margin-bottom:4px}
.oprog-head span{font-size:11px;color:#888}.oprog-head strong{font-size:11px;color:var(--roxo);font-weight:700}
.obar{background:var(--roxo-light);border-radius:20px;height:5px}
.obar-fill{height:5px;border-radius:20px;background:var(--roxo);transition:width .4s}
.tnav{display:flex;gap:6px;padding:10px 1rem;overflow-x:auto;background:white;border-bottom:1px solid #eee}
.tpill{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid #ddd;background:#f5f5f5;color:#888;cursor:pointer;white-space:nowrap;transition:all .15s}
.tpill.active{background:var(--roxo);color:white;border-color:var(--roxo)}.tpill.active.az{background:var(--azul-mid);border-color:var(--azul-mid)}
.tpill.active.ch{background:var(--chumbo-mid);border-color:var(--chumbo-mid)}.tpill.active.am{background:var(--am-mid);border-color:var(--am-mid)}
.tpill.tdone{background:var(--dourado-bg);color:var(--dourado-dark);border-color:var(--dourado)}
.carea{padding:1rem;max-width:700px;margin:0 auto}
.tcard{background:white;border-radius:12px;border:1px solid #eee;overflow:hidden;margin-bottom:.875rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tcard-head{padding:12px 14px;display:flex;align-items:center;gap:9px}
.tcard-head.cp{background:var(--roxo-light);border-bottom:1px solid var(--roxo-mid)}.tcard-head.cp h2{color:var(--roxo-dark)}.tcard-head.cp p{color:var(--roxo)}
.tcard-head.co{background:#FAECE7;border-bottom:1px solid #F0997B}.tcard-head.co h2{color:#993C1D}.tcard-head.co p{color:#D85A30}
.tcard-head.cg{background:var(--verde-bg);border-bottom:1px solid #C0DD97}.tcard-head.cg h2{color:var(--verde)}.tcard-head.cg p{color:var(--verde)}
.tcard-head.ca{background:var(--azul-light);border-bottom:1px solid #B5D4F4}.tcard-head.ca h2{color:#0C447C}.tcard-head.ca p{color:var(--azul)}
.tcard-head.cc{background:var(--chumbo-light);border-bottom:1px solid #CBD5E0}.tcard-head.cc h2{color:var(--chumbo)}.tcard-head.cc p{color:var(--chumbo-mid)}
.tcard-head.cam{background:var(--am-light);border-bottom:1px solid #E8C97A}.tcard-head.cam h2{color:var(--am)}.tcard-head.cam p{color:var(--am-mid)}
.tcard-head .tico{font-size:22px}.tcard-head h2{font-size:14px;font-weight:700}.tcard-head p{font-size:11px}
.tcard-body{padding:14px}
.hbox{border-radius:9px;padding:11px 13px;margin-bottom:10px;font-size:12px;line-height:1.65}
.hbox.roxo{background:var(--roxo-light);border-left:3px solid var(--roxo);color:var(--roxo-dark)}
.hbox.orange{background:#FAECE7;border-left:3px solid #D85A30;color:#993C1D}
.hbox.green{background:var(--verde-bg);border-left:3px solid var(--verde);color:var(--verde)}
.hbox.azul{background:var(--azul-light);border-left:3px solid var(--azul-mid);color:#0C447C}
.hbox.gold{background:var(--dourado-bg);border-left:3px solid var(--dourado);color:var(--dourado-dark)}
.hbox.cinza{background:var(--chumbo-light);border-left:3px solid var(--chumbo-mid);color:var(--chumbo)}
.hbox.amber{background:#FFF3CD;border-left:3px solid #FFCA28;color:#856404}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.iitem{background:#f8f8f8;border-radius:9px;padding:10px}
.iitem .lbl{font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.iitem .val{font-size:14px;font-weight:700;color:#222}.iitem .sub{font-size:10px;color:#999;margin-top:1px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.aitem{background:var(--roxo-light);border-radius:9px;padding:9px 7px;text-align:center}
.aitem .ai{font-size:18px;margin-bottom:3px}.aitem .an{font-size:10px;font-weight:700;color:var(--roxo-dark);line-height:1.3}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.feat-item{background:var(--chumbo-light);border-radius:10px;padding:11px;text-align:center}
.feat-item .fi{font-size:22px;margin-bottom:4px}.feat-item .fn{font-size:11px;font-weight:700;color:var(--chumbo);line-height:1.3}.feat-item .fd{font-size:10px;color:var(--chumbo-mid);margin-top:2px}
.parc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.parc-item{background:#f8f8f8;border-radius:10px;padding:11px;border:1.5px solid #eee}
.parc-item.dest{background:var(--dourado-bg);border-color:var(--dourado)}
.parc-item .pi-icon{font-size:18px;margin-bottom:4px}.parc-item .pi-title{font-size:12px;font-weight:700;color:#222;margin-bottom:3px}
.parc-item.dest .pi-title{color:var(--dourado-dark)}.parc-item .pi-desc{font-size:11px;color:#888;line-height:1.4}.parc-item.dest .pi-desc{color:var(--dourado-dark)}
.pitem{background:#f8f8f8;border-radius:9px;padding:11px;margin-bottom:7px;display:flex;align-items:flex-start;gap:10px}
.pbadge{background:var(--roxo);color:white;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;flex-shrink:0;text-align:center;min-width:58px}.pbadge.o{background:var(--laranja)}
.pinfo{font-size:12px;color:#222;line-height:1.5}.pinfo strong{display:block;font-weight:700;margin-bottom:1px}
.dlist{list-style:none}.dlist li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:12px;color:#222}.dlist li:last-child{border-bottom:none}
.dck{color:var(--dourado);font-size:15px;flex-shrink:0}
.dgrp{margin-bottom:11px}.dgrp h4{font-size:10px;font-weight:700;color:var(--roxo);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.drow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:11px}
.drow .pl{color:#222}.drow .tm{color:var(--roxo);font-weight:700}
.step-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.step-list li{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:#222;line-height:1.5}
.sli-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}
.sli-num.p1{background:var(--roxo);color:white}.sli-num.p2{background:#D85A30;color:white}.sli-num.p3{background:var(--verde);color:white}
.sli-num.az{background:var(--azul-mid);color:white}.sli-num.ch{background:var(--chumbo-mid);color:white}.sli-num.am{background:var(--am-mid);color:white}
.sli-text strong{display:block;font-weight:700;margin-bottom:1px}
.pasta-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pasta-step{background:white;border:1.5px solid var(--chumbo-light);border-radius:10px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px}
.pasta-num{background:var(--chumbo-mid);color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.pasta-info{font-size:12px;color:#222;line-height:1.5}.pasta-info strong{display:block;font-weight:700;color:var(--chumbo);margin-bottom:2px}
.steps-ov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:1rem;background:white;border-bottom:1px solid #eee}
.schip{border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s}
.schip.s1{background:#EEEDFE}.schip.s2{background:#FAECE7}.schip.s3{background:var(--verde-bg)}
.schip.active.s1{border-color:#534AB7}.schip.active.s2{border-color:#D85A30}.schip.active.s3{border-color:var(--verde)}
.schip-num{font-size:18px;font-weight:800;margin-bottom:2px}
.schip-num.s1{color:#534AB7}.schip-num.s2{color:#D85A30}.schip-num.s3{color:var(--verde)}
.schip-name{font-size:10px;font-weight:700;line-height:1.3}
.schip-name.s1{color:var(--roxo-dark)}.schip-name.s2{color:#993C1D}.schip-name.s3{color:var(--verde)}.stick{font-size:10px;margin-top:3px}
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:10px}
.sbadge.p1{background:var(--roxo-light);color:var(--roxo)}.sbadge.p2{background:#FAECE7;color:#993C1D}.sbadge.p3{background:var(--verde-bg);color:var(--verde)}
.sim-box{background:var(--roxo-dark);border-radius:10px;padding:14px;color:white;margin-bottom:10px;text-align:center}
.sim-box .sp{font-size:28px;font-weight:800;color:var(--dourado-light)}.sim-box .sl{font-size:11px;color:rgba(255,255,255,.75)}
.sim-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sim-item{border-radius:9px;padding:11px;text-align:center}
.sim-item.jv{background:var(--roxo-light)}.sim-item.bk{background:var(--dourado-bg)}
.sim-item .sip{font-size:20px;font-weight:800}
.sim-item.jv .sip{color:var(--roxo)}.sim-item.bk .sip{color:var(--dourado-dark)}.sim-item .sil{font-size:10px;color:#888;margin-top:2px}
.gatilho-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}

.gatilho-item .gi{font-size:18px;margin-bottom:3px}.gatilho-item .gn{font-size:10px;font-weight:700;color:var(--roxo-dark);line-height:1.3}
.sim5-list{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}

.validade-badge{background:var(--azul-mid);color:white;border-radius:10px;padding:10px 14px;text-align:center;margin-bottom:14px;font-size:12px;font-weight:700}

.faixas-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}

.faixa-body{padding:12px 14px;background:white}

.resp-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
.resp-card{border-radius:11px;overflow:hidden;border:2px solid}
.resp-card.rep{border-color:#A32D2D}.resp-card.cond{border-color:#FFCA28}.resp-card.ap{border-color:var(--verde)}

.resp-title{color:white;font-size:13px;font-weight:800}.resp-icon{font-size:18px}
.resp-body{padding:12px 14px;background:white;font-size:12px;color:#222;line-height:1.6}
.calc-box{border-radius:12px;padding:16px;margin-bottom:12px;color:white}
.calc-box.roxo-dark{background:linear-gradient(135deg,#26215C,#534AB7)}.calc-box.laranja{background:linear-gradient(135deg,#993C1D,#D85A30)}

const NOTA_MIN=6;

// ESTADO
// ============================================================
const G={user:null,creci:null,cur:0,done:new Set(),sel:null,fAns:[],fDone:false,fScore:0,sh:{}};
function getKey(n,c){return(n+c).toLowerCase().replace(/\s/g,'');}
function docRef(){return window._fbOk?window._db.collection('corretores').doc(getKey(G.user,G.creci)):null;}

// Embaralha alternativas de forma fixa por corretor (mesma ideia da Academy)
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}
function getSh(q,key){
  if(!G.sh[key]){
    let seed=hash(key+(G.creci||'0'));const idx=[...Array(q.o.length).keys()];
    for(let i=idx.length-1;i>0;i--){seed=(seed*9301+49297)%233280;const j=Math.floor(seed/233280*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    G.sh[key]={idx,na:idx.indexOf(q.a)};
  }
  const {idx,na}=G.sh[key];return{...q,o:idx.map(i=>q.o[i]),a:na};
}

// ============================================================
// LOGIN
// ============================================================
function doLogin(){
  const n=document.getElementById('inp-name').value.trim();
  const c=document.getElementById('inp-creci').value.trim();
  if(!n||!c){document.getElementById('login-err').style.display='block';return;}
  G.user=n;G.creci=c;
  try{localStorage.setItem('ujv_sessao_nome',n);localStorage.setItem('ujv_sessao_creci',c);}catch(e){}
  document.getElementById('av').textContent=n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  document.getElementById('hname').textContent=n.split(' ')[0];
  carregar();
}
async function carregar(){
  try{
    const ref=docRef();
    if(ref){
      const snap=await ref.get();
      if(snap.exists){
        const d=snap.data();
        if(d.playbook&&d.playbook.nota!=null){
          G.fDone=true;G.fScore=d.playbook.nota;T.forEach(t=>G.done.add(t.id));
        }
      }else{
        await ref.set({nome:G.user,creci:G.creci,ts:Date.now(),origem:'playbook',data:{}},{merge:true});
      }
    }
  }catch(e){console.warn('Firebase load:',e);}
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-mod').classList.add('active');
  G.cur=G.fDone?T.length:0;
  upd();nav();render();
}
function doLogout(){
  try{localStorage.removeItem('ujv_sessao_nome');localStorage.removeItem('ujv_sessao_creci');}catch(e){}
  location.href='index.html';
}

// NAVEGAÇÃO
// ============================================================
function nav(){
  const el=document.getElementById('pb-nav');el.innerHTML='';
  T.forEach((t,i)=>{const d=document.createElement('div');d.className='tpill'+(G.cur===i?' active':'')+(G.done.has(i)?' tdone':'');d.textContent=t.icon+' '+t.nav;d.onclick=()=>go(i);el.appendChild(d);});
  const fq=document.createElement('div');fq.className='tpill'+(G.cur===T.length?' active':'')+(G.fDone&&G.fScore>=NOTA_MIN?' tdone':'');fq.textContent='🏆 Quiz Final';fq.onclick=()=>go(T.length);el.appendChild(fq);
}
function upd(){
  const p=Math.round((G.done.size/T.length)*100);
  document.getElementById('pb-fill').style.width=p+'%';
  document.getElementById('pb-pct').textContent=p+'%';
  document.getElementById('pb-label').textContent=G.cur<T.length?'Tópico '+(G.cur+1)+' de '+T.length:'Quiz Final';
}
function go(i){
  if(i===T.length&&G.done.size<T.length){alert('Conclua todos os tópicos e responda as perguntas de fixação antes de fazer o Quiz Final!');return;}
  G.cur=i;G.sel=null;upd();nav();render();window.scrollTo({top:0,behavior:'smooth'});
}

  const area=document.getElementById('pb-area');
  if(G.cur===T.length){finalQuiz();return;}

  area.innerHTML=
    '<div class="tcard"><div class="tcard-head cp"><div class="tico">'+t.icon+'</div><div><h2>'+t.title+'</h2><p>'+t.sub+'</p></div></div>'+
    '<div class="tcard-body pb-body"><img class="pb-img" src="'+t.img+'" alt=""/>'+t.body+'</div></div>'+
    '<div class="qsec"><div class="qsec-head"><h3>💡 Pergunta de Fixação</h3></div><div class="qbody"><div class="qtxt">'+q.t+'</div>'+
    '<div class="qopts" id="qopts">'+q.o.map((o,i)=>'<button class="qopt '+(done&&i===q.a?'ok':'')+'" onclick="selQ('+i+')" '+(done?'disabled':'')+'>'+o+'</button>').join('')+'</div>'+
    '<div class="qfb '+(done?'ok':'')+'" id="qfb" style="display:'+(done?'block':'none')+'">'+(done?q.ok:'')+'</div>'+
    (done?'':'<button class="btn-cfm" id="cfm" onclick="confQ()" style="display:none">Confirmar →</button>')+'</div></div>'+
    '<div class="navrow">'+(G.cur>0?'<button class="btn-prev" onclick="go('+(G.cur-1)+')">← Anterior</button>':'')+
    '<button class="btn-adv '+(isLast&&done?'g':'')+'" style="background:'+(isLast&&done?'var(--dourado)':'var(--roxo)')+'" onclick="go('+(G.cur+1)+')" '+(done?'':'disabled')+'>'+(isLast?'🏆 Quiz Final':'Próximo →')+'</button></div>';
}
function selQ(i){if(G.done.has(G.cur))return;G.sel=i;document.querySelectorAll('#qopts .qopt').forEach((b,j)=>b.classList.toggle('sel',j===i));const c=document.getElementById('cfm');if(c)c.style.display='block';}
function confQ(){
  const t=T[G.cur];const q=getSh(t.q,'t'+t.id);const ok=G.sel===q.a;
  document.querySelectorAll('#qopts .qopt').forEach((b,i)=>{b.classList.remove('sel');if(i===q.a)b.classList.add('ok');else if(i===G.sel&&!ok)b.classList.add('no');b.disabled=true;});
  const fb=document.getElementById('qfb');fb.textContent=ok?q.ok:q.no;fb.className='qfb '+(ok?'ok':'no');fb.style.display='block';
  const c=document.getElementById('cfm');if(c)c.style.display='none';
  if(!ok)salvarErro(t.q.t);
  // Sempre libera o avanço — acerto ou erro — para o gestor medir as dificuldades
  G.done.add(t.id);G.sel=null;upd();nav();
  setTimeout(render,900);
}
function salvarErro(pergunta){
  try{
    const ref=docRef();if(!ref)return;
    ref.get().then(function(s){
      const d=s.exists?s.data():{};const lista=d.errosFixacao||[];
      if(lista.some(e=>e.pergunta===pergunta&&e.modulo===MOD_NOME))return;
      lista.push({modulo:MOD_NOME,pergunta:pergunta});
      return ref.set({errosFixacao:lista,updatedAt:new Date().toISOString()},{merge:true});
    }).catch(e=>console.warn('Erro fixação:',e));
  }catch(e){}
}

// ============================================================
// QUIZ FINAL
// ============================================================
function finalQuiz(){
  if(G.fDone){result();return;}
  G.fAns=new Array(F.length).fill(null);
  let h='<div class="fqsec"><div class="fqhead"><h3>🏆 Quiz Final — Módulo 2</h3><p>Responda todas as questões · nota mínima 6,0</p></div><div class="qbody">';
  F.forEach((q,i)=>{const sq=getSh(q,'f'+i);
    h+='<div style="margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid #f0f0f0"><div class="qtxt">'+(i+1)+'. '+sq.t+'</div><div class="qopts" id="fq-'+i+'">'+sq.o.map((o,j)=>'<button class="qopt" onclick="selF('+i+','+j+')">'+o+'</button>').join('')+'</div></div>';});
  h+='</div></div><button class="btn-adv g" style="width:100%;margin-bottom:1rem" onclick="enviar()">Enviar Respostas →</button>';
  document.getElementById('pb-area').innerHTML=h;
}
function selF(qi,oi){G.fAns[qi]=oi;document.querySelectorAll('#fq-'+qi+' .qopt').forEach((b,j)=>b.classList.toggle('sel',j===oi));}
function enviar(){
  if(G.fAns.includes(null)){alert('Responda todas as questões antes de enviar!');return;}
  let s=0;const erros=[];
  F.forEach((q,i)=>{if(G.fAns[i]===getSh(q,'f'+i).a)s++;else erros.push(q.t);});
  G.fScore=Math.round((s/F.length)*10);G.fDone=true;
  try{const ref=docRef();if(ref)ref.set({playbook:{nota:G.fScore,aprovado:G.fScore>=NOTA_MIN,erros:erros,ts:Date.now()},updatedAt:new Date().toISOString()},{merge:true}).catch(e=>console.warn(e));}catch(e){}
  upd();nav();result();window.scrollTo({top:0,behavior:'smooth'});
}
function result(){
  const pass=G.fScore>=NOTA_MIN;
  document.getElementById('pb-area').innerHTML='<div class="rbox"><div class="rico">'+(pass?'🎉':'😔')+'</div><div class="rscore '+(pass?'pass':'fail')+'">'+G.fScore+'/10</div><div class="rmsg">'+(pass?'Aprovado! Módulo 2 concluído!':'Nota mínima não atingida')+'</div><div class="rsub">'+(pass?'Você domina o contorno de objeções. Bora vender!':'Nota mínima é 6,0. Revise os tópicos e tente novamente.')+'</div>'+
    (pass?'<button class="btn-fin" onclick="location.href=\'index.html#escola\'">✓ Voltar à Escola de Vendas</button>':'<button class="btn-retry" onclick="refazer()">Tentar Novamente</button>')+'</div>';
}
function refazer(){G.fDone=false;G.fScore=0;G.fAns=[];Object.keys(G.sh).filter(k=>k[0]==='f').forEach(k=>delete G.sh[k]);finalQuiz();}

// Login automático se já entrou pela Universidade JV
(function(){
  try{
    const n=localStorage.getItem('ujv_sessao_nome'),c=localStorage.getItem('ujv_sessao_creci');
    if(n&&c){document.getElementById('inp-name').value=n;document.getElementById('inp-creci').value=c;doLogin();}
  }catch(e){}
})();
</script>
